name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: typecheck · lint · build · e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      # visual.spec.ts is excluded on purpose: its pixel baselines only
      # match the machine that generated them (README → Tests). The visual
      # regression is a local step: `pnpm test:e2e:update` + `pnpm test:e2e`.
      - name: End-to-end (visual spec excluded)
        run: >-
          npx playwright test
          e2e/options.spec.ts
          e2e/gameplay.spec.ts
          e2e/combat.spec.ts
          e2e/match-flow.spec.ts
          e2e/ranking-history.spec.ts
          e2e/touch.spec.ts

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload traces and failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
